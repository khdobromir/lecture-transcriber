name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      real_smoke:
        description: 'Run installed Linux/ZIP GUI with pinned public Russian speech and real Whisper'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Ubuntu 24.04 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++-18]
    steps:
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates make cmake g++ clang-18 ffmpeg git shellcheck util-linux python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell checks
        run: |
          bash -n install.sh scripts/*.sh
          shellcheck -x install.sh scripts/*.sh
      - name: Build as a regular user
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          useradd --create-home tester
          runuser -u tester -- cmake -S "$GITHUB_WORKSPACE" -B /tmp/transcribe-build -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          runuser -u tester -- cmake --build /tmp/transcribe-build --parallel 2
      - name: Tests
        run: runuser -u tester -- ctest --test-dir /tmp/transcribe-build --output-on-failure
      - name: Repeat cancellation and partial-output crashes
        if: matrix.compiler == 'g++'
        env:
          TEST_CASE_FILTER: reliability_
        run: runuser -u tester -- ctest --test-dir /tmp/transcribe-build -R '^pipeline$' --repeat until-fail:20 --output-on-failure
      - name: Repeat cache reuse and concurrent downloads
        if: matrix.compiler == 'g++'
        env:
          TEST_CASE_FILTER: cache_
        run: runuser -u tester -- ctest --test-dir /tmp/transcribe-build -R '^pipeline$' --repeat until-fail:20 --output-on-failure
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-linux-${{ matrix.compiler }}
          path: /tmp/transcribe-build/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

  debian:
    name: Debian 13 / GCC
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    steps:
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates make cmake g++ ffmpeg git shellcheck util-linux python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell checks
        run: |
          bash -n install.sh scripts/*.sh
          shellcheck -x install.sh scripts/*.sh
      - name: Build and test as a regular user
        run: |
          useradd --create-home tester
          runuser -u tester -- cmake -S "$GITHUB_WORKSPACE" -B /tmp/transcribe-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          runuser -u tester -- cmake --build /tmp/transcribe-build --parallel 2
          runuser -u tester -- ctest --test-dir /tmp/transcribe-build --output-on-failure
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-debian
          path: /tmp/transcribe-build/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates git make cmake g++ clang-18 clang-tidy-18 cppcheck ffmpeg shellcheck util-linux python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: |
          useradd --create-home tester
          runuser -u tester -- cmake -S "$GITHUB_WORKSPACE" -B /tmp/transcribe-build -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Analyze
        env:
          CLANG_TIDY: clang-tidy-18
        run: runuser -u tester -- bash scripts/check-static.sh /tmp/transcribe-build
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-static
          path: /tmp/transcribe-build/compile_commands.json
          if-no-files-found: warn
          retention-days: 14

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed cmake ffmpeg git shellcheck python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell checks
        run: |
          bash -n install.sh scripts/*.sh
          shellcheck -x install.sh scripts/*.sh
      - name: Build and test as a regular user
        run: |
          useradd --create-home tester
          runuser -u tester -- cmake -S "$GITHUB_WORKSPACE" -B /tmp/transcribe-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          runuser -u tester -- cmake --build /tmp/transcribe-build --parallel 2
          runuser -u tester -- ctest --test-dir /tmp/transcribe-build --output-on-failure
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-arch
          path: /tmp/transcribe-build/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

  gui-linux:
    name: Linux / Qt ${{ matrix.qt }} / GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.8.3', '6.11.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang-18 clang-tidy-18 cppcheck shellcheck ffmpeg libgl-dev libglx-dev libopengl-dev libegl-dev libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libfreetype6
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop '${{ matrix.qt }}' linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
      - name: Configure and build
        run: |
          git rev-parse HEAD
          cmake -S . -B "$RUNNER_TEMP/transcribe-gui-build" -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release -DTRANSCRIBE_WARNINGS_AS_ERRORS=ON -DTRANSCRIBE_BUILD_GUI=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/${{ matrix.qt }}/gcc_64"
          cmake --build "$RUNNER_TEMP/transcribe-gui-build" --parallel 4
      - name: Test controllers, GUI with actual CLI, downloads, QML and CLI
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: generic
          QT_QUICK_BACKEND: software
        run: ctest --test-dir "$RUNNER_TEMP/transcribe-gui-build" --output-on-failure
      - name: Smoke the actual Linux install prefix
        run: |
          prefix="$RUNNER_TEMP/Установка 😀"
          qt_root="$RUNNER_TEMP/Qt/${{ matrix.qt }}/gcc_64"
          cmake --install "$RUNNER_TEMP/transcribe-gui-build" --prefix "$prefix"
          LD_LIBRARY_PATH="$qt_root/lib" QT_PLUGIN_PATH="$qt_root/plugins" QML_IMPORT_PATH="$qt_root/qml" python tests/smoke_linux_install.py "$prefix"
      - name: Candidate real Whisper and installed GUI smoke
        if: github.event_name == 'workflow_dispatch' && inputs.real_smoke && matrix.qt == '6.8.3'
        run: |
          engine_source="$RUNNER_TEMP/candidate-whisper"
          git init "$engine_source"
          git -C "$engine_source" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "$engine_source" fetch --depth 1 origin 927cfce34f31707e17f2bff35c349632fb9e2c3a
          git -C "$engine_source" checkout --detach 927cfce34f31707e17f2bff35c349632fb9e2c3a
          cmake -S "$engine_source" -B "$engine_source/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$engine_source/build" --target whisper-cli --parallel 4
          qt_root="$RUNNER_TEMP/Qt/${{ matrix.qt }}/gcc_64"
          LD_LIBRARY_PATH="$qt_root/lib" QT_PLUGIN_PATH="$qt_root/plugins" QML_IMPORT_PATH="$qt_root/qml" python tests/run_real_smoke.py --harness "$RUNNER_TEMP/transcribe-gui-build/gui/test_gui_real" --binary "$RUNNER_TEMP/Установка 😀/bin/transcribe" --engine "$engine_source/build/bin/whisper-cli" --workspace "$RUNNER_TEMP/candidate-real-linux"
      - name: QML lint
        run: cmake --build "$RUNNER_TEMP/transcribe-gui-build" --target all_qmllint
      - name: GUI compilation database static analysis
        if: matrix.qt == '6.8.3'
        env:
          CLANG_TIDY: clang-tidy-18
        run: bash scripts/check-static.sh "$RUNNER_TEMP/transcribe-gui-build"
      - name: Retain GUI test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-logs-qt-${{ matrix.qt }}
          path: |
            ${{ runner.temp }}/transcribe-gui-build/Testing/Temporary/*.log
            ${{ runner.temp }}/transcribe-gui-build/compile_commands.json
            ${{ runner.temp }}/transcribe-gui-build/CMakeCache.txt
            ${{ runner.temp }}/candidate-real-linux/prerequisites.json
            ${{ runner.temp }}/candidate-real-linux/result/validation.json
            ${{ runner.temp }}/candidate-real-linux/result/gui.png
            ${{ runner.temp }}/candidate-real-linux/gui-real.log
          if-no-files-found: warn
          retention-days: 14

  sanitizers-linux:
    name: Linux / ASan UBSan / Qt 6.8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 g++ ffmpeg libgl-dev libglx-dev libopengl-dev libegl-dev libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libfreetype6
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
      - name: Configure and build instrumented project
        run: |
          git rev-parse HEAD
          cmake -S . -B "$RUNNER_TEMP/transcribe-sanitizers" -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DTRANSCRIBE_BUILD_GUI=ON -DTRANSCRIBE_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/gcc_64" -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -O1' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build "$RUNNER_TEMP/transcribe-sanitizers" --parallel 4
      - name: Sanitized project scenarios
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: generic
          QT_QUICK_BACKEND: software
        run: ctest --test-dir "$RUNNER_TEMP/transcribe-sanitizers" --output-on-failure
      - name: Retain sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizer-logs
          path: |
            ${{ runner.temp }}/transcribe-sanitizers/Testing/Temporary/*.log
            ${{ runner.temp }}/transcribe-sanitizers/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows x64 / MSVC / CLI
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B "$env:RUNNER_TEMP/transcribe-build" -A x64 -DTRANSCRIBE_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/transcribe-build" --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native process, Unicode, cache and machine protocol tests
        run: ctest --test-dir "$env:RUNNER_TEMP/transcribe-build" -C Release --output-on-failure
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-windows
          path: ${{ runner.temp }}/transcribe-build/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: Windows x64 / Qt GUI and ZIP smoke
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Qt SDK
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build, test, deploy and smoke package
        run: |
          $RealSmoke = ("${{ github.event_name }}" -eq 'workflow_dispatch') -and ("${{ inputs.real_smoke }}" -eq 'true')
          ./scripts/package-windows.ps1 -QtRoot "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" -WorkDirectory "$env:RUNNER_TEMP/transcribe-package" -Destination "$env:RUNNER_TEMP/transcribe-artifacts" -RealSmoke:$RealSmoke
      - name: Retain tested ZIP and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcribe-windows-x64
          path: ${{ runner.temp }}/transcribe-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-windows-package
          path: |
            ${{ runner.temp }}/transcribe-package/**/Testing/Temporary/*.log
            ${{ runner.temp }}/transcribe-package/**/real-smoke/prerequisites.json
            ${{ runner.temp }}/transcribe-package/**/real-smoke/result/validation.json
            ${{ runner.temp }}/transcribe-package/**/real-smoke/result/gui.png
            ${{ runner.temp }}/transcribe-package/**/real-smoke/gui-real.log
          if-no-files-found: warn
          retention-days: 14
